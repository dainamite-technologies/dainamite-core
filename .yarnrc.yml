# Yarn 4 defaults this to `false` (lifecycle scripts off, supply-chain
# hardening). We need it on: a fresh install builds 15 native packages from
# source — sharp, better-sqlite3, isolated-vm (@open-mercato/ai-assistant),
# esbuild, @datadog/pprof, @newrelic/native-metrics, cpu-features, ssh2,
# msgpackr-extract, protobufjs, unrs-resolver. With scripts disabled they
# install as unbuilt stubs and fail at runtime, not at install time.
# Written by the Yarn 4.17 migration; kept deliberately, not by accident.
enableScripts: true

nodeLinker: node-modules
