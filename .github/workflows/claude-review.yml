name: Claude PR Review

# Auto-review every PR against main:
#   - on PR open / synchronize → posts a fresh analysis as the bot's first comment
#   - on demand via "@claude review" mention in any PR / issue comment
#
# The action checks out the repo, reads CLAUDE.md / AGENTS.md / .ai/skills/
# automatically, then iterates over the diff and posts findings. Auth via
# CLAUDE_CODE_OAUTH_TOKEN (subscription) — no per-token billing, no impact on
# the maintainer's interactive 5h Claude Code window.
#
# What still has to be set up manually before this workflow does anything
# useful:
#   1. Generate an OAuth token locally: `claude setup-token` (one-time, valid
#      ~12 months). Output is a single string starting with `oat_…`.
#   2. Repo Settings → Secrets and variables → Actions → New repository secret:
#      Name=CLAUDE_CODE_OAUTH_TOKEN  Value=<the token from step 1>
#   3. Optional but recommended: install the Anthropic Claude GitHub App so
#      the bot's PR comments come from a dedicated `claude[bot]` author and
#      respect repo CODEOWNERS (`/install-github-app` from local Claude Code).
#
# Rate limiting: the OAuth path uses an inference-only pool separate from the
# CLI's 5h interactive window, so this workflow won't starve local Claude Code
# usage. If account-tier rate limits are hit the action fails the run — re-run
# from the Actions tab, no charges accrue.

on:
  pull_request:
    # `ready_for_review` → the first automatic review happens when a draft
    # is marked ready; pushes to a draft are not reviewed.
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip docs-only churn — saves a review pass when nothing actionable
    # changed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'manuals/**'
  issue_comment:
    types: [created]

# Cancel an in-flight review when a force-push lands a new commit on the same
# PR — re-runs against the latest sha rather than wasting minutes on the
# stale tree.
#
# Concurrency key includes `github.event_name` so the `pull_request` and
# `issue_comment` triggers don't cancel each other: a fresh PR fires both
# events within ~2s of each other (the PR body counts as a comment), and
# without the event-name suffix the issue_comment run silently cancels the
# legitimate pull_request review even though the comment handler itself
# skips (no @claude mention). With per-event groups, each trigger only
# cancels its own in-flight peers — exactly the right behaviour for
# force-pushes and rapid comment edits.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required by anthropics/claude-code-action when the Anthropic Claude
  # GitHub App is installed on the repo — the action mints an OIDC token to
  # exchange for an App installation token (so comments come from claude[bot]
  # instead of github-actions[bot]). Without this the action fails with
  # "Could not fetch an OIDC token" even when CLAUDE_CODE_OAUTH_TOKEN is set.
  id-token: write

jobs:
  review:
    name: Claude review
    # Only run the on-comment branch when someone actually mentions the bot
    # — without this guard every comment on every issue/PR would invoke it.
    # Draft PRs are never reviewed: not on open/push, and not on an
    # "@claude" mention either (the "Skip draft PRs" step below covers the
    # comment path, whose payload has no reliable draft flag). The first
    # review runs when the PR is marked ready (`ready_for_review`).
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip draft PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          is_draft=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          echo "draft=$is_draft" >> "$GITHUB_OUTPUT"
          if [ "$is_draft" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is a draft - review skipped. Mark it ready for review to run it."
          fi

      - name: Checkout
        if: steps.gate.outputs.draft != 'true'
        uses: actions/checkout@v4
        with:
          # The action needs the full PR diff vs base; depth 0 is the safe
          # default, the action will pick the right comparison.
          fetch-depth: 0

      - name: Run Claude review
        if: steps.gate.outputs.draft != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Opus 5.5 pinned for reproducibility (was Sonnet 4.6 until 2026-11-16:
          # too many wrong suggested fixes). max-turns sized for
          # read-CLAUDE.md → AGENTS.md → SKILL.md → sub-skill → diff →
          # inline-comments → write-summary → post-via-gh. The flag is
          # `--allowedTools` (camelCase) — kebab-case is silently ignored.
          #
          # Raised 30 → 60 (2026-08-25). At 30 the action failed the check on
          # every non-trivial PR while the review itself SUCCEEDED — the run
          # reports `"subtype": "success"` and then errors with "reported a
          # successful result after N turns, exceeding the configured maximum".
          # Observed 38, 53 and an outright max_turns abort on one PR. The
          # review comment and inline comments were posted every time, so the
          # red check was pure noise that trained readers to ignore it. The
          # prompt walks ~8 files before it even reaches the diff, so 30 was
          # simply under-sized for this repo's context-loading contract.
          #
          # Two-channel review:
          #   - Inline comments via mcp__github_inline_comment__create…
          #     for specific file:line issues. The action buffers them
          #     and flushes via post-buffered-inline-comments.ts at end.
          #   - Top-level summary via gh pr comment from the same bash
          #     context, so it's authored by claude[bot] (App installation
          #     token, minted by the action via OIDC).
          # If gh pr comment from inside the action is blocked, the
          # standalone "Post review comment" step at the end falls back
          # to GITHUB_TOKEN (comment would appear as github-actions[bot]).
          # Both paths publish the same content.
          claude_args: |
            --max-turns 60
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are reviewing a pull request on the dainamite-core repository
            (a standalone Open Mercato L3 application that hosts the in-tree
            CPQ module destined for extraction to `@dainamite/cpq`).

            Read these BEFORE forming opinions — they are the team's
            non-negotiable contract:

              1. CLAUDE.md — project routing, CPQ → Task → Context Map
              2. AGENTS.md — generic project conventions
              3. .ai/skills/cpq/SKILL.md — engineering bar, hard rules,
                 Definition of Done
              4. Any sub-skill under .ai/skills/cpq/<area>/SKILL.md that
                 matches the touched code (pricing / quoting / products /
                 inventory / orders / arc / packaging)

            And — equally important — the **Open Mercato framework
            conventions**. CPQ runs on top of Open Mercato; ~80% of what
            looks like a CPQ design choice is actually a framework
            convention. Patterns guessed from generic Next.js / TypeScript /
            MikroORM knowledge will violate documented framework
            invariants. The framework's authoritative docs ship inside
            node_modules — load them when the PR touches the relevant
            surface:

              - node_modules/@open-mercato/core/AGENTS.md — master
                extensibility contract: modules, DI (Awilix), events,
                custom fields, ACL, setup, response enrichers, API
                interceptors, widget injection, component replacement,
                RBAC wildcard matcher, withAtomicFlush, command pattern
              - node_modules/@open-mercato/core/src/modules/sales/AGENTS.md
                — sales (quote → order → invoice flow); CPQ piggybacks on
                sales for headers
              - node_modules/@open-mercato/core/src/modules/<module>/AGENTS.md
                — customers / catalog / currencies / integrations /
                data_sync / workflows / customer_accounts / auth (RBAC) /
                directory
              - node_modules/@open-mercato/events/AGENTS.md — event bus,
                createModuleEvents, subscribers (persistent vs ephemeral),
                SSE bridge
              - node_modules/@open-mercato/shared/AGENTS.md — withAtomicFlush,
                response enrichers, query engine extensibility, feature-
                match helpers (wildcard-aware)
              - node_modules/@open-mercato/ui/AGENTS.md — CrudForm,
                DataTable, primitives, sidebar icons, FormHeader/FormFooter
              - node_modules/@open-mercato/cli/AGENTS.md — generator
                system, auto-discovery file patterns, module-scoped
                migrations
              - node_modules/@open-mercato/queue/AGENTS.md — worker
                contract, idempotency, local/async strategies
              - node_modules/@open-mercato/<package>/AGENTS.md — for any
                other framework package the PR touches

            Where the framework's docs and our project conventions
            diverge, our conventions win for repo-local code (e.g. CPQ
            uses `api/<resource>/route.ts`; new sibling modules under
            `src/modules/` follow framework's `api/<method>/<path>.ts`).
            Surface the divergence rather than picking sides silently.

            ## Focus: High and Medium findings only

            Your job is to catch things worth a human's time. Classify every
            candidate finding before you report it:

              - **High** - will break or is unsafe: a bug on a normal path,
                data loss / corruption, missing tenant scoping or
                authorization (`requireFeatures`, ACL), security issue,
                cross-module ORM relation, entity change without a generated
                migration, breaking public contract without a
                `packages/cpq/MIGRATION.md` entry, missing `openApi` on a
                new route.
              - **Medium** - real problem, narrower blast radius: bug on an
                edge case that will actually occur, unbounded query / per-row
                fetch on a list that can grow, missing unit tests for a
                changed service / validator / state machine, missing
                `withAtomicFlush` on mutate-then-query, wildcard-unsafe
                feature check, a cluster of hardcoded user-facing strings.
              - **Minor** - everything else: naming, style, formatting,
                comment wording, optional refactors, "could be cleaner",
                defensive checks for cases that cannot happen, personal
                preference. Minors are NOT problems. They never go into
                the review comment and never get an inline comment (see
                channel C below). When unsure between Medium and Minor,
                it is Minor.

            ## Accuracy rules - a wrong finding is worse than none

            1. **Verify before reporting.** The diff hunk is not enough.
               `Read` the whole changed function / file at the PR head, and
               `Grep` for callers, types and the code the finding depends
               on. If the code already handles the case (guard upstream,
               validator, DB constraint, framework default), drop it.
            2. **No guessing about the framework.** If a finding depends on
               Open Mercato behaviour, confirm it in the relevant
               `node_modules/@open-mercato/*/AGENTS.md` or source. Cannot
               confirm? Drop it, or ask it as a question ("Is X handled
               elsewhere?") instead of asserting a defect.
            3. **Suggested fixes must be checked.** Only propose code when
               every identifier, import path and signature in it exists in
               the repo (grep it) and the fix matches the surrounding
               patterns. Otherwise describe the problem and the expected
               behaviour, and leave the fix to the author. Never post
               speculative code. Never use GitHub ```suggestion``` blocks
               unless the replacement is exact and verified.
            4. **Every finding states the concrete failure**: which input or
               state produces which wrong result. No concrete failure =
               not High/Medium.
            5. **Stay on the diff.** Do not report pre-existing problems in
               untouched code, unless High and directly made reachable by
               this PR.
            6. **Do not re-report** issues already raised in earlier review
               comments on this PR (`gh pr view <N> --comments`) unless the
               new commits did not fix them; then say "still open".

            Your output is ONE review comment (High/Medium only) plus, when
            there are any, ONE separate minor-notes comment. Review comment
            sections:

            ### What this PR does (1–3 sentences)
            Plain-English summary of intent + scope. Mention the JIRA ticket
            (XD-NNN) if obvious from branch name / commit messages.

            ### Conventions check
            Use the list below as your checklist, but REPORT ONLY items the
            PR violates or misses, with file:line evidence ("VIOLATED" /
            "MISSING"). Do not list items that pass or that the PR does not
            touch. Nothing violated? Write "No violations found."

            **Open Mercato framework invariants** (apply everywhere):
              - **Auto-discovery layout**: filenames + locations *are* the
                contract — `events.ts`, `acl.ts`, `setup.ts`, `ce.ts`,
                `data/entities.ts`, `data/validators.ts`, `data/enrichers.ts`,
                `data/extensions.ts`, `subscribers/*.ts`, `workers/*.ts`,
                `widgets/injection-table.ts`, `widgets/components.ts`,
                `translations.ts`, `notifications.ts`, `search.ts`. Anything
                relocated to a non-canonical path will be silently skipped by
                the bootstrap.
              - **Run `yarn generate` after structural changes**: editing
                `src/modules.ts`, `events.ts`, `acl.ts`, `data/enrichers.ts`,
                widget files, `api/`, `subscribers/`, `workers/` — without
                regen, `.mercato/generated/*` goes stale. Never edit
                `.mercato/generated/*` by hand.
              - **Run `yarn mercato db generate` after entity changes**:
                migration must be a generated file, never hand-written.
              - **No imports from `node_modules/@open-mercato/*` outside
                of allowed entry points** — never edit `node_modules`; eject
                the module via `yarn mercato eject <module>` if it must be
                customised beyond extension primitives.
              - **DI via Awilix**: services resolved from the container,
                not `new`-ed directly; closure-resolution pattern preferred
                for new services.
              - **Commands for writes** (sales / catalog mutations): writes
                go through commands (`execute` + `undo`); side-effect
                emitters live OUTSIDE `withAtomicFlush`.
              - **Cross-module = framework primitive, not direct import**:
                Need to react to a write? Subscriber + event. Need to
                extend another module's API response? Response enricher.
                Need a UI add-on? Widget injection / component replacement.
                Direct import of another module's services / entities is a
                code smell; ORM relations across module boundaries are a
                hard fail.
              - **Events follow `createModuleEvents`** with id pattern
                `module.entity.action` (singular entity, past tense, e.g.
                `sales.order.created`). Persistent vs ephemeral chosen
                deliberately per the events guide.
              - **Worker contract**: `metadata = { queue, id?, concurrency? }`
                exported from each `workers/*.ts`; idempotent under retry.
              - **No `any` types**: Zod schemas everywhere user input
                lands; `z.infer` for derived TS types; runtime narrows for
                anything still unknown.
              - **Encrypted queries via `findWithDecryption`** when the
                entity has encrypted columns — never raw `em.find` for
                those.

            **CPQ-specific (on top of the framework rules)**:
              - **API-first**: every new route exports `openApi`. New write
                routes call `validateCrudMutationGuard` /
                `runCrudMutationGuardAfterSuccess` (or use
                `createCrudOpenApiFactory`).
              - **CPQ routing convention**: `api/<resource>/route.ts`
                (Next.js style). New sibling modules outside CPQ use
                framework's `api/<method>/<path>.ts`.
              - **No cross-module ORM**: no `@ManyToOne` / `@OneToMany` from
                cpq to non-cpq entities. `customer_id` / `product_id` /
                `quote_id` are FK strings.
              - **Tenant scoping**: every new entity has `organizationId` +
                `tenantId` indexed, standard `created_at` / `updated_at` /
                `deleted_at` / `is_active` columns, UUID PK.
              - **Atomic flush**: `withAtomicFlush` wraps any "mutate scalars
                then query on same EM" sequence.
              - **Status enums**: changes to status sets land in
                `services/types.ts` (`CPQ_STATUSES`,
                `INVENTORY_SUBSCRIPTION_STATUSES`, …) — never inline.
              - **ACL**: features added to `acl.ts` AND wired in
                `setup.ts` `defaultRoleFeatures`. Use `hasFeature` /
                `hasAllFeatures` for runtime checks (not `.includes()` —
                wildcard grants like `cpq.*` will silently fail).
              - **i18n**: user-facing strings via `useT()` /
                `resolveTranslations()` — no hardcoded labels.
              - **Sidebar icons**: `lucide-react` only — never inline SVG
                via `React.createElement`.
              - **Detail page accompanies list page**: any new entity
                exposed in admin UI has both list and `[id]` pages, with
                loading / 404 / error states distinct, `FormHeader` in
                `detail` mode, injection slots for cross-module add-ons.
              - **DataTable**: pagination wired (`page`, `pageSize`,
                `totalCount`, `onPageChange`); `pageSize` ≤ 100.
              - **Manual updated**: any operator-facing behaviour change
                is reflected in `manuals/*.md`.
              - **MIGRATION.md updated**: any breaking change to a CPQ
                public contract (route signatures, validator shapes,
                emitted event payloads, public service methods) has an
                entry in `packages/cpq/MIGRATION.md`.
              - **CPQ never imports from `src/modules/<other>/`** —
                customer-specific code goes to `src/modules/@app/<feature>/`,
                NOT inside `src/modules/cpq/`.
              - **API ships with its MCP / AI tool**
                (`.ai/skills/mcp-tools/SKILL.md`): a new or changed
                route has a typed `openApi` (`OpenApiRouteDoc` with
                `methods`), an API-backed tool in `<module>/ai-tools/`
                whose `requiredFeatures` match the route, write tools
                refuse without `approvedPendingActionId`, and the tool
                is in the module agent's `allowedTools`. A missing tool
                for an agent-relevant route is Medium; a write tool
                without the approval guard is High. Routes deliberately
                not for agents are fine when the PR says so.
              - **Tests obligatory**: services / validators / state
                machines / seeds touched have unit tests; UI flows
                touched have a Playwright integration spec under
                `__integration__/TC-CPQ-*.spec.ts`. Use
                `jest --config jest.config.cjs` (already wired via
                `yarn test`) — see `.ai/skills/unit-tests/SKILL.md`.

            ### Findings
            High first, then Medium. One bullet each:
            `**[High]** <file>:<line> - <what breaks, for which input/state>. <fix or expected behaviour>`.
            No Minor items here. No findings? Write "No High or Medium
            findings." and keep the section.

            ### Test coverage gaps
            Mark scenarios from the relevant manual or spec that the PR
            should have covered but didn't (matches the project's "scenarios
            in tests" rule for ARC and similar feature areas). Only gaps
            that matter (changed logic without a test); not "could also
            test X". Omit the section if there are none.

            ### Risk callouts
            Anything that could regress neighbouring areas — e.g. shared
            helpers used elsewhere, generated `.mercato/` consequences,
            seed/migration ordering. Brief. Omit the section if there are
            none.

            Tone: senior reviewer, terse, no fluff. Don't repeat the diff
            back at the user. Don't compliment things that are merely
            correct — focus on what's worth a human's attention.

            If the PR is docs-only or trivial, say so in 1 line and stop.

            ## Output format — IMPORTANT

            Use THREE channels:

            **A. Inline comments: High / Medium findings only.**
            For each High or Medium finding anchored to a precise location
            (a violated invariant, a buggy line, a missing piece in a
            specific function), call:

            ```
            mcp__github_inline_comment__create_inline_comment
              path: "<repo-relative path>"
              line: <number, end-of-range for multi-line>
              body: "**[High]** <short, actionable message, 1-3 sentences max>"
            ```

            Start every body with `**[High]**` or `**[Medium]**`. Never
            post an inline comment for a Minor item. Use inline only when
            the finding pins to ONE place. Don't repeat the diff: say
            what's wrong and how to fix it. Aim for 0-6 inline comments;
            if you find more, you're probably including Minors.

            **B. Top-level summary comment — for the synthesis.**
            Use the `Write` tool to save the markdown review to
            **`/tmp/claude-review.md`**, then post via `Bash`:

            ```bash
            gh pr comment <PR_NUMBER> --body-file /tmp/claude-review.md
            ```

            (PR number from `$GITHUB_REF` or `gh pr view`.) The
            top-level summary covers the sections above (What this PR does
            / Conventions check / Findings / Test coverage gaps / Risk
            callouts). Inside "Findings", cross-reference inline comments
            by adding "(see inline)" instead of repeating the detail.

            **C. Minor notes: separate comment, FYI only.**
            If you have Minor items, write them to
            **`/tmp/claude-review-minors.md`** and post as a SECOND
            comment:

            ```bash
            gh pr comment <PR_NUMBER> --body-file /tmp/claude-review-minors.md
            ```

            Format exactly:

            ```
            #### Minor notes (FYI, no action required)
            - `<file>:<line>` <one line, max ~15 words>
            ```

            One line per item, no code, no suggested patches, at most 10
            items (keep the most useful). These are optional, not review
            blockers: never phrase them as defects or requests. No Minor
            items? Do not create the file and do not post this comment.

            Posting via `gh pr comment` from inside the action uses the
            Claude GitHub App installation token, so the comment is
            authored by `claude[bot]` with branded avatar.

            If the PR is trivial / docs-only, skip inline and minor notes
            entirely and write a 1-line file ("_Trivial change, no review
            needed._") posted as a top-level comment.

      - name: Fallback — post review comment if claude[bot] didn't
        if: success() && steps.gate.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Preferred path: Claude already posted via gh pr comment from
          # inside the action (using the Claude GitHub App's installation
          # token, so the comment appears as claude[bot]). This step is
          # the safety net — if the action couldn't post (permission edge
          # case, network blip), fall back to publishing the same review
          # markdown via GITHUB_TOKEN. The fallback comment appears as
          # `github-actions[bot]` instead, but the content is identical.
          if [ ! -s /tmp/claude-review.md ]; then
            echo "::warning::No review file produced — Claude run may have failed silently."
            exit 0
          fi

          # Skip fallback if a claude[bot] comment is already on the PR
          # for this run (Claude posted successfully). We match by author
          # and a marker present in every review (the "What this PR does"
          # heading or — for trivial PRs — the "Trivial change" line).
          existing_count=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '[.comments[] | select(.author.login == "claude")] | length' \
            2>/dev/null || echo 0)
          if [ "$existing_count" != "0" ]; then
            echo "claude[bot] already posted ($existing_count comment(s)) — skipping fallback."
            exit 0
          fi

          echo "claude[bot] did not post — falling back to github-actions[bot]."
          gh pr comment "$PR_NUMBER" --body-file /tmp/claude-review.md
          if [ -s /tmp/claude-review-minors.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/claude-review-minors.md
          fi
